services:
  db:
    image: postgres:16-alpine
    container_name: ai_agency_db

    environment:
      POSTGRES_DB: ai_agency
      POSTGRES_USER: ai_agency
      POSTGRES_PASSWORD: ai_agency_password



    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ai_agency -d ai_agency"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai_agency_backend

    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql+psycopg://ai_agency:ai_agency_password@db:5432/ai_agency
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ai_agency_frontend

    depends_on:
      - backend

    ports:
      - "5173:80"


volumes:
  postgres_data: